<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PulsoFinanceiro</title>
<style>
  /* Tokens de docs/08-design-system.md — dark exclusivo */
  :root {
    --canvas:#070A0F; --surface1:#0D121A; --surface2:#131A24;
    --border:#202B3A; --text:#F4F7FB; --text2:#AAB6C6; --muted:#778397;
    --brand:#38D6C7; --success:#42D392; --warning:#F6C85F; --danger:#FF667A;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--canvas); color:var(--text);
    font-family: system-ui, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:24px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .card {
    background:var(--surface1); border:1px solid var(--border);
    border-radius:16px; padding:16px;
  }
  .metric { font-size:28px; font-weight:650; letter-spacing:-0.5px; }
  .label { font-size:12px; font-weight:560; color:var(--text2); text-transform:none; }
  .pos { color:var(--success); } .neg { color:var(--danger); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { padding:8px; border-bottom:1px solid var(--border); text-align:left; }
  th { color:var(--text2); font-weight:560; font-size:11px; }
  .num { text-align:right; }
  .badge { font-size:10px; border:1px solid var(--border); border-radius:999px; padding:2px 8px; color:var(--warning); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pulso <span style="color:var(--brand)">Financeiro</span></h1>
  <div class="sub">painel financeiro automático · base F0 · dados via Pluggy, cálculo local</div>

  <div class="grid" id="kpis">
    <div class="card"><div class="label">Entradas (mês)</div><div class="metric" id="kpi-income">—</div></div>
    <div class="card"><div class="label">Gastos (mês)</div><div class="metric" id="kpi-spend">—</div></div>
    <div class="card"><div class="label">Resultado</div><div class="metric" id="kpi-net">—</div></div>
    <div class="card"><div class="label">Provisórios</div><div class="metric" id="kpi-pending">—</div><span class="badge" id="kpi-pending-badge" hidden>provisório</span></div>
  </div>

  <p style="height:16px"></p>
  <div class="card">
    <table>
      <thead><tr><th>Categoria</th><th class="num">Total</th></tr></thead>
      <tbody id="cats"><tr><td colspan="2" style="color:var(--muted)">carregando…</td></tr></tbody>
    </table>
  </div>
</div>
<script type="module">
  const fmt = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
  const period = new Date().toISOString().slice(0,7);
  try {
    const r = await fetch(`/api/summary?period=${period}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    document.getElementById('kpi-income').textContent = fmt.format(d.income);
    const spend = document.getElementById('kpi-spend');
    spend.textContent = fmt.format(d.spend);
    const net = document.getElementById('kpi-net');
    net.textContent = fmt.format(d.net);
    net.className = 'metric ' + (d.net >= 0 ? 'pos' : 'neg');
    const pend = document.getElementById('kpi-pending');
    pend.textContent = String(d.pendingCount);
    if (d.pendingCount > 0) document.getElementById('kpi-pending-badge').hidden = false;
    const tb = document.getElementById('cats');
    tb.innerHTML = d.byCategory.length
      ? d.byCategory.slice(0,10).map(c =>
        `<tr><td>${c.label ?? c.categoryId ?? 'sem categoria'}</td><td class="num">${fmt.format(c.total)}</td></tr>`
      ).join('')
      : '<tr><td colspan="2" style="color:var(--muted)">nenhuma transação confirmada neste mês</td></tr>';
  } catch (e) {
    for (const id of ['kpi-income','kpi-spend','kpi-net','kpi-pending'])
      document.getElementById(id).textContent = 'indisponível';
  }
</script>
</body>
</html>
